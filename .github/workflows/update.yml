name: Update UN Women RSS
on:
  schedule:
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert official UN Women feed
        run: python build_feed.py
      - name: Commit updated RSS if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unwomen_jobs.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update UN Women vacancies"
            git push
          fi
